<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Christmas Village: countdown, wish list for Santa, random charm greeting cards and a snow globe. Thai / English / 中文 / Español.">
<meta property="og:title" content="หมู่บ้านคริสต์มาส · Christmas Village">

<meta property="og:type" content="website">

<title>หมู่บ้านคริสต์มาส</title>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--sky1:#0b1430;--sky2:#1d3566;--pine:#16513a;--berry:#b3202f;--candle:#ffcf70;--snow:#f6f9ff;--wood:#4a2f1d;--ink:#3a1f1f;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--sky1)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;min-height:100vh;background:linear-gradient(#0b1430,#1d3566 65%,#2c4f85);color:var(--snow);font-family:'Mali','Sarabun','PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans Thai',sans-serif;font-weight:500;line-height:1.5}
#bg{position:fixed;inset:0;pointer-events:none;z-index:0}
main{position:relative;z-index:1;max-width:460px;margin:0 auto;padding:18px 16px 40px}
.scr[hidden]{display:none}
h1{font-size:2rem;line-height:1.2;margin:.2em 0 0;text-align:center;color:var(--candle);text-shadow:0 0 18px rgba(255,207,112,.45)}
h2{font-size:1.5rem;margin:.3em 0;color:var(--candle)}
.sub{text-align:center;margin:.3em 0 1em;opacity:.85}
svg.v{width:100%;height:auto;display:block;border-radius:20px}
.win{animation:glow 3.2s ease-in-out infinite}.win:nth-of-type(2n){animation-delay:-1.1s}.win:nth-of-type(3n){animation-delay:-2s}
@keyframes glow{50%{opacity:.55}}
.menu{display:grid;gap:12px;margin-top:16px}
.btn,.sign{font:inherit;font-weight:700;color:var(--snow);cursor:pointer;border:0;text-decoration:none}
.sign{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:14px;border:2px solid var(--candle);box-shadow:0 4px 0 rgba(0,0,0,.35)}
.sign b{font-size:1.1rem;display:block}.sign small{font-weight:500;opacity:.85}
.sign i{font-style:normal;font-size:2rem}
.s1{background:var(--berry)}.s2{background:var(--pine)}.s3{background:#244a8a}
.btn{padding:11px 16px;border-radius:12px;background:var(--berry);border:2px solid var(--candle)}
.btn.alt{background:#244a8a}.btn.ghost{background:transparent;border-color:rgba(255,255,255,.4)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.row>*{flex:1}
:focus-visible{outline:3px solid var(--candle);outline-offset:2px}
.back{display:inline-block;color:var(--snow);text-decoration:none;padding:6px 0;opacity:.9}
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center;margin:12px 0}
.cd div{background:rgba(255,255,255,.1);border:2px solid var(--candle);border-radius:14px;padding:10px 2px}
.cd b{display:block;font-size:2rem;line-height:1.1;color:var(--candle)}
.panel{background:rgba(11,20,48,.7);border:1px solid rgba(255,255,255,.25);border-radius:16px;padding:14px;margin-top:14px}
input,textarea{width:100%;font:inherit;padding:10px 12px;border-radius:10px;border:2px solid rgba(255,255,255,.3);background:rgba(255,255,255,.95);color:var(--ink);margin:4px 0}
label{font-size:.9rem;opacity:.9}
ul{list-style:none;padding:0;margin:8px 0}
li{display:flex;justify-content:space-between;align-items:center;gap:8px;background:rgba(255,255,255,.1);border-radius:10px;padding:6px 10px;margin:6px 0}
li button{background:none;border:0;color:var(--snow);font-size:1.1rem;cursor:pointer}
#reply{margin-top:10px;padding:12px;border-radius:12px;background:var(--snow);color:var(--ink);animation:pop .4s}
@keyframes pop{from{transform:scale(.9);opacity:0}}
#cv{width:100%;max-width:300px;aspect-ratio:9/16;display:block;margin:12px auto;border-radius:16px;border:3px solid var(--candle)}
#gl{width:100%;max-width:360px;display:block;margin:6px auto;touch-action:none}
#ov{position:fixed;inset:0;z-index:5;background:rgba(5,10,25,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;text-align:center}
#ov[hidden]{display:none}#ov img{max-height:62vh;max-width:100%;border-radius:12px}
#t{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--snow);color:var(--ink);padding:10px 16px;border-radius:999px;z-index:6;max-width:90%;text-align:center;opacity:0;pointer-events:none;transition:opacity .25s}
#t.on{opacity:1}
svg.v{box-shadow:0 0 28px rgba(255,207,112,.22)}
.langs{display:flex;gap:6px;justify-content:flex-end;margin-bottom:8px}.langs button{font:inherit;font-size:.85rem;color:var(--snow);background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:4px 12px;cursor:pointer}.langs button[aria-pressed=true]{background:var(--candle);color:var(--ink);border-color:var(--candle)}
.cd span{display:block;font-size:.85rem}#ovp{white-space:pre-line}
.tw{animation:tw 2.6s ease-in-out infinite}.tw:nth-of-type(2n){animation-delay:-.9s}.tw:nth-of-type(3n){animation-delay:-1.7s}@keyframes tw{50%{opacity:.3}}
.sm{transform-box:fill-box;transform-origin:center;animation:smk 4.5s linear infinite}@keyframes smk{from{transform:translate(0,0) scale(.6);opacity:.7}to{transform:translate(8px,-20px) scale(1.6);opacity:0}}
.sl{animation:fly 28s linear infinite}@keyframes fly{from{transform:translate(-70px,70px)}to{transform:translate(410px,36px)}}
@media (prefers-reduced-motion:reduce){.win,.tw,.sm{animation:none}.sl{animation:none;transform:translate(230px,64px)}#reply{animation:none}}
</style>
</head>

<script>
const $=s=>document.querySelector(s),R=a=>a[Math.random()*a.length|0],RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const PAGES=['home','countdown','card','globe'],LINK=location.href.split('#')[0].replace(/index\.html$/,'');
let tt;function toast(m){const e=$('#t');e.textContent=m;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),2800)}
async function inv(text){const d={title:X('title'),text,url:LINK};try{if(navigator.share){await navigator.share(d);return}}catch(e){if(e.name==='AbortError')return}try{await navigator.clipboard.writeText(text+' '+LINK);toast(X('copied'))}catch(e){toast(LINK)}}
['invH','invC','invG'].forEach(i=>$('#'+i).onclick=()=>inv(X('inv')));

/* i18n */
